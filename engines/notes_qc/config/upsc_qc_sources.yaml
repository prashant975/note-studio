# Approved-source registry per subject, from the "Sources to be used" table of
# the Notes QC Framework. Loaded/validated by src/qc/qc_config.py.
#
# local_index paths are RELATIVE to the writable app-data dir (see
# src/qc/paths.py app_data_dir) in frozen mode, and to the repo root in source
# mode. Missing indexes are a warning, never a crash (spec §12).

version: "1.0"

source_priority:
  - constitution_or_bare_act
  - official_government_source
  - official_institutional_report
  - ncert
  - approved_standard_book
  - recognised_academic_source

blocked_source_types:
  - wikipedia
  - coaching_website
  - random_blog
  - anonymous_content
  - ai_generated_summary

# UI labels / detector outputs -> registry keys. Normalisation is
# case/whitespace-insensitive; see SourceRouter.normalise().
subject_aliases:
  polity: polity
  "indian polity": polity
  "भारतीय राजव्यवस्था": polity
  economy: economy
  "indian economy": economy
  "अर्थव्यवस्था": economy
  geography: indian_geography
  "indian geography": indian_geography
  "भारतीय भूगोल": indian_geography
  "world geography": world_geography
  ancient: ancient_history
  "ancient history": ancient_history
  "प्राचीन इतिहास": ancient_history
  medieval: medieval_history
  "medieval history": medieval_history
  "मध्यकालीन इतिहास": medieval_history
  modern: modern_history
  "modern history": modern_history
  "modern history & freedom struggle": modern_history
  "आधुनिक इतिहास": modern_history
  "world history": world_history
  "post independence": post_independence
  "post independence india": post_independence
  culture: art_culture
  "art & culture": art_culture
  "art and culture": art_culture
  environment: environment
  "environment & ecology": environment
  science: science_technology
  "science & tech": science_technology
  "science & technology": science_technology
  "s&t": science_technology
  ir: international_relations
  "international relations": international_relations
  society: society_social_justice
  "indian society": society_social_justice
  "society and social justice": society_social_justice
  security: internal_security
  "internal security": internal_security
  governance: governance
  "governance & public administration": governance
  ethics: ethics
  "ethics, integrity & aptitude": ethics
  agriculture: agriculture
  "disaster management": disaster_management
  "government schemes": government_schemes
  essay: essay
  # Umbrella key from the app's area picker: router merges the three history
  # subjects and records a warning.
  history: _history_umbrella

subjects:
  polity:
    display_name: "Indian Polity"
    books:
      - id: "laxmikanth"
