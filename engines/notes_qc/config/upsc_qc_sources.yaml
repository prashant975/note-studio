      - id: "bare_act_pm_bakshi"
        name: "Bare Act - P. M. Bakshi"
        local_index: "reference_index/polity/bare_act"
    official_domains:
      - "legislative.gov.in"
      - "lawcommissionofindia.nic.in"
      - "pib.gov.in"
    claim_types:
      - constitutional_article
      - schedule
